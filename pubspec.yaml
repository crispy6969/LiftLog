name: liftlog
description: A private, offline weightlifting progress tracker.
publish_to: none
version: 1.1.0+2

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.1'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.4.2
  path: ^1.9.1
  intl: ^0.20.2
  file_selector: ^1.1.0
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - lib/core/database/schema.sql

